services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: turno, POSTGRES_PASSWORD: turno, POSTGRES_DB: turno_medicos}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U turno -d turno_medicos"], interval: 5s, timeout: 5s, retries: 10}
    volumes: [turno_pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["3000:3000"]
volumes: {turno_pgdata: {}}
