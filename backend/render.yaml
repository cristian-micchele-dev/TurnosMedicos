services:
  - type: web
    name: turno-medicos-api
    runtime: docker
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: {name: turno-medicos-db, property: connectionString}
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
databases:
  - name: turno-medicos-db
